name: Add app index card styling

on:
  push:
    paths:
      - '.github/workflows/app-index-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Add shallow cards to project index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()

          css_path = Path('styles.css')
          css = css_path.read_text()
          if old not in css:
              raise SystemExit('Expected project-list block not found')
          css_path.write_text(css.replace(old, new, 1))

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('href="./styles.css"', 'href="./styles.css?v=20261009-1"', 1)
          index.write_text(html)
          PY
      - name: Commit card styling
        shell: bash
        run: |
          git config user.name "github-pages[bot]"
          git config user.email "github-pages[bot]@users.noreply.github.com"
          git add styles.css index.html
          git commit -m "Add shallow cards to app index"
          git push origin master
