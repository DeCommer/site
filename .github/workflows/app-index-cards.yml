name: Add app index card styling

on:
  push:
    paths:
      - '.github/workflows/app-index-cards.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Add shallow cards to project index
        shell: python
        run: |
          from pathlib import Path

          path = Path('styles.css')
          css = path.read_text()
          old = '''.project-list { border-top: 1px solid var(--line); }
.project-list a {
  min-height: 62px;
  display: grid;
  grid-template-columns: 42px 1fr 28px;
  align-items: center;
  gap: 14px;
  padding: 0 8px 0 0;
  border-bottom: 1px solid var(--line);
  text-decoration: none;
  transition: background-color .15s ease, padding .15s ease, color .15s ease;
}
.project-list a:hover {
  background: var(--hover);
  padding-left: 13px;
}
'''
          new = '''.project-list {
  display: grid;
  gap: 10px;
}
.project-list a {
  min-height: 62px;
  display: grid;
  grid-template-columns: 42px 1fr 28px;
  align-items: center;
  gap: 14px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: var(--paper);
  box-shadow:
    0 1px 2px rgba(0, 0, 0, .07),
    0 4px 10px rgba(0, 0, 0, .05);
  text-decoration: none;
  transition: background-color .15s ease, padding .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
html[data-theme="dark"] .project-list a {
  box-shadow:
    0 1px 2px rgba(0, 0, 0, .22),
    0 4px 12px rgba(0, 0, 0, .16);
}
.project-list a:hover {
  background: var(--hover);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  padding-left: 18px;
  transform: translateY(-1px);
  box-shadow:
    0 2px 4px rgba(0, 0, 0, .08),
    0 6px 14px rgba(0, 0, 0, .07);
}
'''
          if old not in css:
              raise SystemExit('Expected project-list block not found')
          path.write_text(css.replace(old, new, 1))

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('href="./styles.css"', 'href="./styles.css?v=20261009-1"', 1)
          index.write_text(html)

      - name: Commit card styling
        shell: bash
        run: |
          git config user.name "github-pages[bot]"
          git config user.email "github-pages[bot]@users.noreply.github.com"
          git add styles.css index.html
          git commit -m "Add shallow cards to app index"
          git push origin master
