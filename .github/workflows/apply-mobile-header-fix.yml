name: Apply mobile header fix

on:
  push:
    paths:
      - '.github/workflows/apply-mobile-header-fix.yml'

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Add mobile correction stylesheet
        shell: python
        run: |
          from pathlib import Path
          import re

          app_link = '    <link rel="stylesheet" href="/css/mobile-fix.css?v=20261008-1">\n'
          home_link = '  <link rel="stylesheet" href="./css/mobile-fix.css?v=20261008-1">\n'
          painting_link = '    <link rel="stylesheet" href="./css/mobile-fix.css?v=20261008-1">\n'

          # Homepage
          p = Path('index.html')
          text = p.read_text()
          if 'css/mobile-fix.css' not in text:
              text = text.replace('  <link rel="stylesheet" href="./styles.css">\n', '  <link rel="stylesheet" href="./styles.css">\n' + home_link, 1)
              p.write_text(text)

          # Paintings: use the proper mobile header instead of forcing the full desktop hero onto phones.
          p = Path('paintings.html')
          text = p.read_text()
          text = re.sub(
              r'\s*<style>\s*@media \(max-width: 800px\) \{\s*\.hero \{ display: flex !important; \}\s*\.mobile-title-container \{ display: none !important; \}\s*\}\s*</style>',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if 'css/mobile-fix.css' not in text:
              text = text.replace('    <link rel="stylesheet" href="./css/paintings.css">\n', '    <link rel="stylesheet" href="./css/paintings.css">\n' + painting_link, 1)
          text = text.replace('<h2 class="title">DeCommer.com</h2>', '<h2 class="title">Joseph DeCommer</h2>', 1)
          p.write_text(text)

          # Every app page already has a main.css link. Add the mobile correction immediately after it.
          for p in Path('projects').rglob('*.html'):
              text = p.read_text()
              if '/css/mobile-fix.css' in text:
                  continue
              pattern = r'(^\s*<link[^>]+href="[^"]*main\.css(?:\?v=[^"]*)?"[^>]*>\s*$)'
              updated, count = re.subn(pattern, lambda m: m.group(1) + '\n' + app_link.rstrip(), text, count=1, flags=re.M)
              if count:
                  p.write_text(updated)

      - name: Commit mobile layout updates
        shell: bash
        run: |
          git config user.name "github-pages[bot]"
          git config user.email "github-pages[bot]@users.noreply.github.com"
          git add index.html paintings.html projects '*.html' 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix obscured name on mobile"
            git push origin master
          fi
