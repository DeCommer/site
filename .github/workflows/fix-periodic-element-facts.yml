name: Fix Periodic Table element facts

on:
  push:
    paths:
      - '.github/workflows/fix-periodic-element-facts.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Repair element clicks and modal positioning
        shell: bash
        run: |
          python -c "from pathlib import Path; import base64; p=Path('projects/periodic-project/js/periodic.js'); b=p.read_bytes(); old=base64.b64decode('ICAgICAgICBpZiAoIWUudGFyZ2V0Lm1hdGNoZXMoJy5jYXJkJykpIHJldHVybjsNCiAgICAgICAgbGV0IGVsZW1JZCA9IE51bWJlcihlLnRhcmdldC5pZCk7'); new=base64.b64decode('ICAgICAgICBjb25zdCBjYXJkID0gZS50YXJnZXQuY2xvc2VzdCgnLmNhcmQnKTsNCiAgICAgICAgaWYgKCFjYXJkIHx8ICF0YWJsZU1haW4uY29udGFpbnMoY2FyZCkpIHJldHVybjsNCiAgICAgICAgY29uc3QgZWxlbUlkID0gTnVtYmVyKGNhcmQuaWQpOw=='); assert old in b; b=b.replace(old,new,1); old2=base64.b64decode('ICAgICAgICBpZihlbGVtSWQgPiAwKSB7DQogICAgICAgICAgICBtb2RhbC5zdHlsZS5wb3NpdGlvbiA9ICdmaXhlZCc7DQogICAgICAgICAgICBtb2RhbC5zdHlsZS50b3AgPSBgLSR7ZG9jdW1lbnQuYm9keS5zY3JvbGxZfXB4YDsNCiAgICAgICAgfQ=='); new2=base64.b64decode('ICAgICAgICBtb2RhbC5zdHlsZS5wb3NpdGlvbiA9ICcnOw0KICAgICAgICBtb2RhbC5zdHlsZS50b3AgPSAnJzsNCiAgICAgICAgbW9kYWwuc3R5bGUubGVmdCA9ICcnOw0KICAgICAgICBtb2RhbC5zdHlsZS50cmFuc2Zvcm0gPSAnJzs='); assert old2 in b; p.write_bytes(b.replace(old2,new2,1))"
          python -c "from pathlib import Path; p=Path('projects/periodic-project/periodic.html'); s=p.read_text(); s=s.replace('./css/periodic.css\"','./css/periodic.css?v=20261009-1\"',1); s=s.replace('<link rel=\"stylesheet\" href=\"/css/mobile-fix.css?v=20261009-4\">','<link rel=\"stylesheet\" href=\"/css/mobile-fix.css?v=20261009-4\">\n    <link rel=\"stylesheet\" href=\"./css/periodic-fix.css?v=20261009-1\">',1); s=s.replace('./js/periodic.js\"','./js/periodic.js?v=20261009-1\"',1); p.write_text(s)"
      - name: Commit Periodic Table fix
        shell: bash
        run: |
          git config user.name "github-pages[bot]"
          git config user.email "github-pages[bot]@users.noreply.github.com"
          git add projects/periodic-project
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Fix Periodic Table element facts"
            git push origin master
          fi
