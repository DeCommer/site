name: Refresh Percent container stylesheet references

on:
  push:
    paths:
      - '.github/workflows/match-percent-containers.yml'

permissions:
  contents: write

jobs:
  refresh-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Bump app shared stylesheet version
        shell: bash
        run: |
          find projects -type f -name '*.html' -print0 | xargs -0 perl -pi -e 's/mobile-fix\.css\?v=20261009-2/mobile-fix.css?v=20261009-3/g'
      - name: Commit refreshed app references
        shell: bash
        run: |
          git config user.name "github-pages[bot]"
          git config user.email "github-pages[bot]@users.noreply.github.com"
          git add projects
          if git diff --cached --quiet; then
            echo "No app references needed updating."
          else
            git commit -m "Refresh Percent-style app containers"
            git push origin master
          fi
