name: Refresh app surface styles

on:
  push:
    paths:
      - '.github/workflows/refresh-app-surface-v4.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Bump project stylesheet version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changed = []
          for path in Path('projects').rglob('*.html'):
              text = path.read_text(errors='ignore')
              updated = text.replace('mobile-fix.css?v=20261009-3', 'mobile-fix.css?v=20261009-4')
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          print(f'Updated {len(changed)} project pages')
          PY
      - name: Commit refreshed project references
        shell: bash
        run: |
          git config user.name "github-pages[bot]"
          git config user.email "github-pages[bot]@users.noreply.github.com"
          git add projects
          if git diff --cached --quiet; then
            echo "No project references needed updating."
          else
            git commit -m "Refresh app surface stylesheet references"
            git push origin master
          fi
