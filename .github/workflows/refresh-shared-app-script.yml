name: Refresh shared app script references

on:
  push:
    paths:
      - '.github/workflows/refresh-shared-app-script.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Cache-bust shared app script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r'((?:\.\.?/)+js/scripts\.js)(?!\?v=)')
          changed = []
          for path in Path('projects').rglob('*.html'):
              text = path.read_text(errors='ignore')
              updated = pattern.sub(r'\1?v=20261009-2', text)
              if updated != text:
                  path.write_text(updated)
                  changed.append(str(path))
          print(f'Updated {len(changed)} project pages')
          PY
      - name: Commit refreshed references
        shell: bash
        run: |
          git config user.name "github-pages[bot]"
          git config user.email "github-pages[bot]@users.noreply.github.com"
          git add projects
          if git diff --cached --quiet; then
            echo "No references needed updating."
          else
            git commit -m "Refresh shared app script references"
            git push origin master
          fi
