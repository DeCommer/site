name: Refresh State Facts flag assets

on:
  push:
    paths:
      - '.github/workflows/refresh-state-map-flags.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Cache-bust State Facts assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('projects/map/map.html')
          text = path.read_text()
          text = text.replace('./css/map.css"', './css/map.css?v=20261009-1"')
          text = text.replace('./js/map.js"', './js/map.js?v=20261009-1"')
          path.write_text(text)
          PY
      - name: Commit refreshed State Facts references
        shell: bash
        run: |
          git config user.name "github-pages[bot]"
          git config user.email "github-pages[bot]@users.noreply.github.com"
          git add projects/map/map.html
          if git diff --cached --quiet; then
            echo "No references needed updating."
          else
            git commit -m "Refresh State Facts flag assets"
            git push origin master
          fi
