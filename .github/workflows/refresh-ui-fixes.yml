name: Refresh shared UI fixes

on:
  push:
    paths:
      - '.github/workflows/refresh-ui-fixes.yml'

permissions:
  contents: write

jobs:
  refresh-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Bump shared UI fix stylesheet version
        shell: bash
        run: |
          find . -type f -name '*.html' -print0 | xargs -0 perl -pi -e 's/mobile-fix\.css\?v=20261008-1/mobile-fix.css?v=20261008-2/g'
      - name: Commit refreshed references
        shell: bash
        run: |
          git config user.name "github-pages[bot]"
          git config user.email "github-pages[bot]@users.noreply.github.com"
          git add -- '*.html'
          if git diff --cached --quiet; then
            echo "No HTML references needed updating."
          else
            git commit -m "Refresh shared UI fix stylesheet"
            git push origin master
          fi
