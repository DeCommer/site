name: Remove homepage logo labels

on:
  push:
    paths:
      - '.github/workflows/remove-home-logo-labels.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Remove only the two requested logo labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text()
          text = text.replace('            <span>DECOMMER.COM</span>\n', '', 1)
          text = text.replace('            <strong>DECOMMER</strong>\n', '', 1)
          path.write_text(text)
          PY
      - name: Commit homepage logo cleanup
        shell: bash
        run: |
          git config user.name "github-pages[bot]"
          git config user.email "github-pages[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
          else
            git commit -m "Remove text labels from homepage logo panel"
            git push origin master
          fi
