name: Revert homepage app cards

on:
  push:
    paths:
      - '.github/workflows/revert-homepage-cards.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Restore flat homepage project list
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('styles.css')
          css = path.read_text()
          old = '''.project-list {
  display: grid;
  gap: 10px;
}
.project-list a {
  min-height: 62px;
  display: grid;
  grid-template-columns: 42px 1fr 28px;
  align-items: center;
  gap: 14px;
  padding: 0 14px;
  border: 1px solid color-mix(in srgb, var(--ink) 24%, var(--line));
  border-radius: 10px;
  background: var(--paper);
  box-shadow:
    0 0 12px rgba(0, 0, 0, .055),
    0 2px 8px rgba(0, 0, 0, .035);
  text-decoration: none;
  transition: background-color .15s ease, padding .15s ease, color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
html[data-theme="dark"] .project-list a {
  border-color: color-mix(in srgb, var(--ink) 34%, var(--line));
  box-shadow:
    0 0 16px rgba(0, 0, 0, .20),
    0 2px 10px rgba(0, 0, 0, .12);
}
.project-list a:hover {
  background: var(--hover);
  border-color: color-mix(in srgb, var(--accent) 45%, var(--line));
  padding-left: 18px;
  transform: translateY(-1px);
  box-shadow:
    0 0 16px rgba(0, 0, 0, .07),
    0 3px 10px rgba(0, 0, 0, .05);
}
'''
          new = '''.project-list { border-top: 1px solid var(--line); }
.project-list a {
  min-height: 62px;
  display: grid;
  grid-template-columns: 42px 1fr 28px;
  align-items: center;
  gap: 14px;
  padding: 0 8px 0 0;
  border-bottom: 1px solid var(--line);
  text-decoration: none;
  transition: background-color .15s ease, padding .15s ease, color .15s ease;
}
.project-list a:hover {
  background: var(--hover);
  padding-left: 13px;
}
'''
          if old not in css:
              raise SystemExit('Expected homepage card block not found')
          path.write_text(css.replace(old, new, 1))

          index = Path('index.html')
          html = index.read_text()
          html = html.replace('styles.css?v=20261009-2', 'styles.css?v=20261009-3', 1)
          index.write_text(html)
          PY
      - name: Commit homepage revert
        shell: bash
        run: |
          git config user.name "github-pages[bot]"
          git config user.email "github-pages[bot]@users.noreply.github.com"
          git add styles.css index.html
          git commit -m "Restore flat homepage app index"
          git push origin master
