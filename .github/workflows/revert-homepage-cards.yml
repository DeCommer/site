name: Revert homepage app cards

on:
  push:
    paths:
      - '.github/workflows/revert-homepage-cards.yml'

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Restore flat homepage project list
        shell: bash
        run: |
          python -c "from pathlib import Path; import base64; p=Path('styles.css'); s=p.read_text(); old=base64.b64decode('').decode(); new=base64.b64decode('').decode(); assert old in s; p.write_text(s.replace(old,new,1)); q=Path('index.html'); h=q.read_text(); q.write_text(h.replace('styles.css?v=20261009-2','styles.css?v=20261009-3',1))"
      - name: Commit homepage revert
        shell: bash
        run: |
          git config user.name "github-pages[bot]"
          git config user.email "github-pages[bot]@users.noreply.github.com"
          git add styles.css index.html
          git commit -m "Restore flat homepage app index"
          git push origin master
